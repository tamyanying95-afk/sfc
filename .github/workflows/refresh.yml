name: Refresh SFC data

on:
  schedule:
    # 每月最后一天 02:00 UTC（香港时间 10:00）
    # GitHub cron 不支持 "L"（最后一天），所以 28–31 号都跑，
    # 只用「明天是不是 1 号」判断是否真的是当月最后一天。
    - cron: "0 2 28-31 * *"
  workflow_dispatch:   # 随时可在 Actions 页面手动点「Run workflow」

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is it the last day of the month?
        id: gate
        run: |
          tomorrow=$(date -u -d 'tomorrow' +%d)
          echo "tomorrow(day-of-month)=$tomorrow"
          if [ "$tomorrow" = "01" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true"  >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install deps
        if: steps.gate.outputs.run == 'true'
        run: pip install openpyxl

      - name: Fetch buy-side data
        if: steps.gate.outputs.run == 'true'
        run: python scripts/sfc_headcount.py

      - name: Fetch sell-side data
        if: steps.gate.outputs.run == 'true'
        run: python scripts/sfc_sellside_headcount.py

      - name: Build combined report
        if: steps.gate.outputs.run == 'true'
        run: python scripts/build_combined_report.py

      - name: Publish to repo root
        if: steps.gate.outputs.run == 'true'
        run: |
          STAMP=$(date -u +%Y%m%d)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          cp scripts/output/sfc_combined_report.html index.html
          cp scripts/output/sfc_combined.xlsx "sfc_${STAMP}.xlsx"

      - name: Commit if changed
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html "sfc_${STAMP}.xlsx"
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "chore: refresh SFC data ${STAMP}"
            git push
          fi
